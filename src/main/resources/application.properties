spring.application.name=logss
server.port=4318
# Only this machine can connect. logss has no login and stores SQL values and request bodies.
server.address=127.0.0.1

# Local SQLite store. WAL lets the UI read while the collector writes;
# foreign_keys makes deleting a trace remove its spans and issues.
# IMMEDIATE transactions take the write lock up front, so the collector and the
# trace finalizer wait for each other (busy_timeout) instead of failing with SQLITE_BUSY.
spring.datasource.url=jdbc:sqlite:logss.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on&transaction_mode=IMMEDIATE
spring.datasource.hikari.maximum-pool-size=4
spring.sql.init.mode=always
